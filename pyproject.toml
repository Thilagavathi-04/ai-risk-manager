[project]
name = "ai-risk-manager"
version = "0.1.0"
description = "AI Risk Manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "jinja2>=3.1,<4.0",
  "kagglehub>=0.3,<1.0",
  "mlflow>=2.15,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "python-multipart>=0.0.9,<0.1",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "ipykernel>=6.29,<7.0",
]

[project.scripts]
ai-risk-manager = "main:run"

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "db", "routes"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI Risk Manager merchant risk dashboard and review workflow">
    <title>{% block title %}ai-risk-manager{% endblock %}</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --panel: #ffffff;
        --panel-soft: #eef5ff;
        --primary: #133a5e;
        --primary-2: #1d5aa6;
        --accent: #2dbb9a;
        --warning: #f59e0b;
        --danger: #dc2626;
        --text: #123048;
        --muted: #5f7388;
        --border: #dfeaf5;
        --shadow: 0 14px 32px rgba(19, 58, 94, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #edf5ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      a { color: inherit; text-decoration: none; }

      .site-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }

      .topbar {
        background: rgba(19, 58, 94, 0.96);
        color: white;
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 18px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #67d5bb, #3a87d8);
        font-weight: 700;
        color: white;
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: 0.02em;
      }

      .brand-copy p {
        margin: 2px 0 0;
        color: rgba(255,255,255,0.75);
        font-size: 0.8rem;
      }

      .nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav a {
        color: rgba(255,255,255,0.8);
        padding: 8px 12px;
        border-radius: 10px;
        transition: all 0.2s ease;
      }

      .nav a:hover {
        background: rgba(255,255,255,0.08);
        color: white;
      }

      main {
        margin-top: 28px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 24px;
        margin-bottom: 24px;
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }

      .page-head h2 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        color: var(--primary-2);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
      }

      .stat-card {
        background: linear-gradient(135deg, #f7fbff 0%, #edf6ff 100%);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 16px;
      }

      .stat-card strong {
        display: block;
        font-size: 1.6rem;
        margin-bottom: 8px;
        color: var(--primary);
      }

      .stat-card span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      th, td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      th {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: #f8fbff;
      }

      tbody tr:hover {
        background: #f9fbff;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
        background: #e8f5ef;
        color: #195d46;
      }

      .risk-high { background: #ffeaea; color: var(--danger); }
      .risk-medium { background: #fff5dc; color: #b45309; }
      .risk-low { background: #e8f9ee; color: #166534; }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      .btn {
        appearance: none;
        border: none;
        background: var(--primary-2);
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.secondary {
        background: #eef4ff;
        color: var(--primary);
      }

      .btn.success {
        background: var(--accent);
      }

      .btn.warning {
        background: var(--warning);
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }

      .meta-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin: 18px 0 0;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .meta-box, .field-box {
        background: #f7fbff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .field-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-box label {
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .field-box input {
        width: 100%;
        border: 1px solid var(--border);
        background: white;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
      }

      .meta-box small {
        display: block;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .meta-box strong {
        font-size: 1.1rem;
      }

      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .quick-links a {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--primary-2);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .list-card {
        padding: 0;
      }

      .list-card ol {
        margin: 0;
        padding: 18px 20px 18px 36px;
      }

      .list-card li {
        padding: 8px 0;
        color: var(--text);
      }

      dl {
        margin: 0;
      }

      dt {
        font-weight: 700;
        margin-top: 12px;
      }

      dd {
        margin: 4px 0 0 0;
        color: var(--muted);
      }

      @media (max-width: 800px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div class="brand-copy">
            <h1>ai-risk-manager</h1>
            <p>AI Merchant Risk Manager</p>
          </div>
        </div>
        <nav class="nav" aria-label="Main navigation">
          <a href="/">Dashboard</a>
          <a href="/transactions">Transactions</a>
          <a href="/reviews">Reviews</a>
          <a href="/evaluation">Evaluation</a>
          <a href="/audit">Audit</a>
          <a href="/settings">Settings</a>
          <a href="/settings#model-test-section">Model Test</a>
        </nav>
      </header>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
